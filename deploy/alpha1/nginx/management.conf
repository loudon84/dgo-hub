log_format alpha_safe '$status $request_method $upstream_status';
access_log /var/log/nginx/access.log alpha_safe;
error_log /dev/null crit;
server {
  listen 443 ssl;
  server_name management.local;
  ssl_certificate /run/alpha1/leaf.pem;
  ssl_certificate_key /run/alpha1/leaf-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  location = /health { proxy_pass http://api:3000/health; proxy_set_header Host $host; }
  location = /hub/v1/me { proxy_pass http://api:3000/hub/v1/me; proxy_set_header Host $host; }
  location /hub/v1/me/agent-credentials { proxy_pass http://api:3000; proxy_set_header Host $host; }
  location / { return 404; }
}
