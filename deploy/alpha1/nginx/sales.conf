log_format alpha_safe '$status $request_method $upstream_status';
access_log /var/log/nginx/access.log alpha_safe;
error_log /dev/null crit;
server {
  listen 443 ssl;
  server_name sales.local;
  ssl_certificate /run/alpha1/leaf.pem;
  ssl_certificate_key /run/alpha1/leaf-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  location = /mcp/sales {
    proxy_pass http://mcp:3001/mcp/sales;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }
  location / { return 404; }
}
