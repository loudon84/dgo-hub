name: dgo-hub-integration
services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub_dev_password
      POSTGRES_DB: hub
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./examples/init-db.sql:/docker-entrypoint-initdb.d/001-hasura.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      retries: 20
  hasura:
    image: hasura/graphql-engine:v2.51.1
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://hub:hub_dev_password@postgres:5432/hub
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://hub:hub_dev_password@postgres:5432/hasura_metadata
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:-change-me-admin-secret}
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"${HASURA_JWT_SECRET:-change-me-hasura-jwt-secret-at-least-32-bytes}"}'
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
    ports: ["127.0.0.1:8088:8080"]
  api:
    build: .
    command: ["sh","-c","node dist/migrate.js && node dist/app.js"]
    depends_on:
      postgres: { condition: service_healthy }
      hasura: { condition: service_started }
    environment:
      DATABASE_URL: postgres://hub:hub_dev_password@postgres:5432/hub
      INGEST_API_KEY: ${INGEST_API_KEY:-change-me-ingest-key}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-admin-key}
      HELIX_URL: ${HELIX_URL:-}
      HELIX_WORKSPACE_ID: ${HELIX_WORKSPACE_ID:-}
      HELIX_READ_TOKEN: ${HELIX_READ_TOKEN:-}
      OPENMETADATA_URL: ${OPENMETADATA_URL:-}
      OPENMETADATA_TOKEN: ${OPENMETADATA_TOKEN:-}
    ports: ["127.0.0.1:3100:3000"]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 20
  worker:
    build: .
    command: ["node","dist/etl-worker/worker.js"]
    depends_on:
      api: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://hub:hub_dev_password@postgres:5432/hub
      CRM_DB_URL: ${CRM_DB_URL:-}
      ORDER_DB_URL: ${ORDER_DB_URL:-}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-15000}
      OPENMETADATA_URL: ${OPENMETADATA_URL:-}
      OPENMETADATA_TOKEN: ${OPENMETADATA_TOKEN:-}
    restart: unless-stopped
  publisher:
    build: .
    command: ["node","dist/permission-publish/worker.js"]
    depends_on:
      api: { condition: service_healthy }
      hasura: { condition: service_started }
    environment:
      DATABASE_URL: postgres://hub:hub_dev_password@postgres:5432/hub
      HASURA_URL: http://hasura:8080
      HASURA_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:-change-me-admin-secret}
    restart: unless-stopped
  mcp:
    build: .
    command: ["node","dist/sales-mcp/main.js"]
    depends_on:
      api: { condition: service_healthy }
      publisher: { condition: service_started }
    environment:
      DATABASE_URL: postgres://hub:hub_dev_password@postgres:5432/hub
      HASURA_URL: http://hasura:8080
      HASURA_JWT_SECRET: ${HASURA_JWT_SECRET:-change-me-hasura-jwt-secret-at-least-32-bytes}
      AGENT_JWT_SECRET: ${AGENT_JWT_SECRET:-change-me-at-least-32-bytes-long}
      AGENT_JWT_ISSUER: ${AGENT_JWT_ISSUER:-data-hub}
      AGENT_JWT_AUDIENCE: ${AGENT_JWT_AUDIENCE:-sales-mcp}
    ports: ["127.0.0.1:3101:3001"]
    restart: unless-stopped
volumes:
  pgdata:
